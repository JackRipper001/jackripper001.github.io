<!DOCTYPE html> 
<html lang="id">

<head>

    <meta charset="UTF-8">

    <!-- Responsive Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Kata Bijak Imam Syafi'i</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);

            font-family: 'Poppins', sans-serif;

            overflow-x: hidden;

            padding: 20px;

        }

        /* Background Glow */
        .glow {

            position: absolute;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            filter: blur(120px);

            opacity: 0.25;

        }

        .glow1 {

            background: #38bdf8;

            top: -100px;

            left: -100px;

        }

        .glow2 {

            background: #8b5cf6;

            bottom: -100px;

            right: -100px;

        }

        .quote-box {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 850px;

            padding: clamp(25px, 5vw, 55px);

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.1);

            box-shadow: 0 15px 40px rgba(0,0,0,0.35);

            text-align: center;

            color: white;

            animation: fadeUp 1.2s ease;

        }

        .quote-icon {

            font-size: clamp(40px, 6vw, 60px);

            color: rgba(255,255,255,0.15);

            margin-bottom: 15px;

        }

        .quote-text {

            font-size: clamp(1rem, 2vw, 1.7rem);

            line-height: 2;

            font-weight: 300;

            word-wrap: break-word;

        }

        .highlight {

            color: #38bdf8;

            font-weight: 600;

        }

        .author {

            margin-top: 35px;

            font-size: clamp(0.9rem, 1.5vw, 1.1rem);

            font-weight: 500;

            letter-spacing: 2px;

            color: #ffffff;

        }

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform: translateY(40px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        /* Mobile Responsive */
        @media (max-width: 576px) {

            body{
                padding: 15px;
            }

            .quote-box {

                border-radius: 22px;

            }

            .quote-text {

                line-height: 1.8;

            }

            .author{
                margin-top: 25px;
                letter-spacing: 1px;
            }

            .glow{
                width: 220px;
                height: 220px;
            }
        }

    </style>

</head>

<body>

<!-- Glow Background -->
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- Quote Card -->
<div class="quote-box">

    <div class="quote-icon">❝</div>

    <div class="quote-text">

        “Saat kamu menyampaikan <span class="highlight">kebenaran</span>, 
        kamu akan mendapat dua reaksi: 
        orang cerdas akan <span class="highlight">merenung</span>, 
        sedangkan orang bodoh akan <span class="highlight">tersinggung</span>.”

    </div>

    <div class="author">

        — Imam Syafi'i

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

  </html>
